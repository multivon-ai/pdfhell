[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfhell"
version = "0.5.3"
description = "PDF Hell — adversarial PDFs that break AI document readers. Procedural ground truth, not LLM-as-judge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Multivon" }]
keywords = ["llm", "evaluation", "pdf", "multimodal", "benchmark", "adversarial", "document-ai", "rag"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

# Core deps. multivon-eval already brings in anthropic + openai SDKs as
# transitive deps — we pin google-genai explicitly here so a bare install
# Just Works against any of the three frontier providers the README
# promises (zero-extras setup is a launch-day non-negotiable).
# reportlab generates adversarial PDFs from code; pypdf is the read side.
dependencies = [
    # 0.9.1 is where multivon_eval.vision lives + the Anthropic
    # reasoning-tier temperature fix lands. Older multivon-eval still
    # works for v1/v2 traps but won't survive Opus 4-7 calls.
    "multivon-eval>=0.9.1",
    "google-genai>=1.0",
    "reportlab>=4.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# No provider extras needed — the three SDKs are core. The "all" alias
# is kept for backward-compat with pip install 'pdfhell[all]' commands
# that might appear in older docs.
all = []
# Research loop (pdfhell.research) needs the provider SDKs as
# *direct* deps to drive the researcher rotation + text-only verifier
# calls bypassing multivon-eval's adapter layer.
research = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "pdfplumber>=0.11",
]

[project.scripts]
pdfhell = "pdfhell.cli:main"

[project.urls]
Homepage = "https://multivon.ai/pdfhell"
Repository = "https://github.com/multivon-ai/pdfhell"
Issues = "https://github.com/multivon-ai/pdfhell/issues"
Leaderboard = "https://multivon.ai/leaderboard"
Documentation = "https://docs.multivon.ai/pdfhell/quickstart"

[tool.setuptools.packages.find]
include = ["pdfhell*"]

[tool.setuptools.package-data]
"pdfhell" = [
    "cases/**/*.json",
    "cases/**/*.pdf",
    "research/program.md",
    "research/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
