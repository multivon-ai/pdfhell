name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        # Plain pip + setup-python keeps the workflow simple. We previously
        # used `uv pip install --system` but uv 0.11.16+ refuses to install
        # into its own managed interpreter (PEP 668 externally-managed),
        # which broke the workflow. setup-python gives us a clean,
        # standalone interpreter where pip just works.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        # tests/ contains zero live-API calls — every research-module
        # test stubs the provider SDKs. No secrets needed at this layer.
        run: pytest tests/ -q

  smoke-cli:
    # CLI smoke test — verify `pdfhell` installs and the basic commands work
    # end-to-end with no real provider calls. `build --suite smoke` is
    # entirely local: it generates 3 PDFs from deterministic seeds.
    name: CLI smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - run: pdfhell --version
      - run: pdfhell list-traps
      - run: pdfhell build --suite smoke --out /tmp/smoke-cases
      - name: Verify smoke suite produced 3 PDFs
        run: |
          test $(ls /tmp/smoke-cases/*.pdf | wc -l) -eq 3 \
            || (echo "smoke suite did not produce 3 PDFs" && exit 1)
