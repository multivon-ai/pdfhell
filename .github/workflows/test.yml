name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          uv pip install --system -e .
          uv pip install --system pytest

      - name: Run tests
        run: pytest tests/ -q

  smoke-cli:
    # CLI smoke test — verify `pdfhell` installs and the basic commands work
    # end-to-end with no real provider calls (we monkeypatch the vision dispatch).
    name: CLI smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system -e .
      - run: pdfhell --version
      - run: pdfhell list-traps
      - run: pdfhell build --suite smoke --out /tmp/smoke-cases
      - run: |
          test $(ls /tmp/smoke-cases/*.pdf | wc -l) -eq 3 \
            || (echo "smoke suite did not produce 3 PDFs" && exit 1)
